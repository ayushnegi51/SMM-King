<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast SMM Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; }
        header { background: #1e293b; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 22px; color: #38bdf8; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
        .card h2 { margin-bottom: 15px; color: #38bdf8; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
        .btn { background: #0ea5e9; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:hover { background: #0284c7; }
        .price-tag { color: #4ade80; font-weight: bold; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Fast SMM Panel</h1>
        <p style="color: #94a3b8;">Real SMM Raja API Connected</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>🛒 Create New Order</h2>
            
            <div class="form-group">
                <label>Category</label>
                <select id="categorySelect" onchange="filterServices()">
                    <option value="">Loading categories from SMM Raja...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Service</label>
                <select id="serviceSelect" onchange="updatePrice()">
                    <option value="">Select Category First</option>
                </select>
                <span id="priceDisplay" class="price-tag"></span>
            </div>

            <div class="form-group">
                <label>Target Link</label>
                <input type="text" id="targetLink" placeholder="https://instagram.com/yourprofile">
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="quantity" placeholder="1000" oninput="calculateTotal()">
            </div>

            <div class="form-group">
                <label>Total Price (INR)</label>
                <input type="text" id="totalPrice" readonly placeholder="₹0.00">
            </div>

            <button class="btn" onclick="alert('Order Feature Connected! Add Payment Backend to Process Order.')">Place Order</button>
        </div>
    </div>

    <script>
        let allServices = [];

        async function loadServices() {
            try {
                const response = await fetch('/api/services');
                allServices = await response.json();

                const categories = [...new Set(allServices.map(s => s.category))];
                const catSelect = document.getElementById('categorySelect');
                catSelect.innerHTML = '<option value="">-- Choose Category --</option>';

                categories.forEach(cat => {
                    const opt = document.createElement('option');
                    opt.value = cat;
                    opt.textContent = cat;
                    catSelect.appendChild(opt);
                });
            } catch (err) {
                alert('Failed to load SMM Raja services: ' + err);
            }
        }

        function filterServices() {
            const selectedCat = document.getElementById('categorySelect').value;
            const servSelect = document.getElementById('serviceSelect');
            servSelect.innerHTML = '<option value="">-- Choose Service --</option>';

            const filtered = allServices.filter(s => s.category === selectedCat);
            filtered.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.service;
                opt.dataset.rate = s.selling_rate_inr;
                opt.dataset.min = s.min;
                opt.dataset.max = s.max;
                opt.textContent = `${s.name} - ₹${s.selling_rate_inr}/1K (Min: ${s.min})`;
                servSelect.appendChild(opt);
            });
            updatePrice();
        }

        function updatePrice() {
            const servSelect = document.getElementById('serviceSelect');
            const selectedOption = servSelect.options[servSelect.selectedIndex];
            const priceDisplay = document.getElementById('priceDisplay');

            if (selectedOption && selectedOption.dataset.rate) {
                priceDisplay.textContent = `Rate: ₹${selectedOption.dataset.rate} per 1,000 | Min: ${selectedOption.dataset.min} - Max: ${selectedOption.dataset.max}`;
            } else {
                priceDisplay.textContent = '';
            }
            calculateTotal();
        }

        function calculateTotal() {
            const servSelect = document.getElementById('serviceSelect');
            const selectedOption = servSelect.options[servSelect.selectedIndex];
            const qty = parseFloat(document.getElementById('quantity').value) || 0;

            if (selectedOption && selectedOption.dataset.rate) {
                const ratePer1k = parseFloat(selectedOption.dataset.rate);
                const total = (ratePer1k * qty) / 1000;
                document.getElementById('totalPrice').value = '₹' + total.toFixed(2);
            } else {
                document.getElementById('totalPrice').value = '₹0.00';
            }
        }

        window.onload = loadServices;
    </script>
</body>
</html>
